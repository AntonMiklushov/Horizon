[project]
name = "horizon"
version = "0.1.0"
description = "AI-driven information aggregation system for tracking academic and social trends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "google-genai>=0.3.0",
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "ddgs>=7.0.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.10.2",
    "jinja2>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mcp>=1.0.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
]
render = [
    "premailer>=3.10.0",
]

[project.scripts]
horizon = "src.main:main"
horizon-mcp = "src.mcp.server:main"
horizon-wizard = "src.setup.wizard:main"
horizon-webhook = "src.services.webhook_cli:main"
horizon-web = "src.horizon_ext.web.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/horizon_ext/rendering/templates" = "src/horizon_ext/rendering/templates"
"src/horizon_ext/web/templates" = "src/horizon_ext/web/templates"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.codex-tmp*",
    "/.env",
    "/.env.local",
    "/.env.*.local",
    "/.horizon-codex-*",
    "/.horizon-qa",
    "/.pytest_cache",
    "/.pytest-tmp",
    "/.pytest-manual-tmp",
    "/data/config.json",
    "/data/*.bak",
    "/data/mcp-runs",
    "/data/mcp-runs/**",
    "/data/*secrets*.json",
    "/data/summaries",
    "/data/summaries/**",
    "/data/subscribers.json",
    "/.cursor/*secrets*.json",
    "/config/*secrets*.json",
    "/docs/_posts",
    "/horizon-qa",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
