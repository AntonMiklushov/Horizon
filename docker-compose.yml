version: '3.8'

services:
  horizon:
    build: .
    container_name: horizon
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=UTC
    restart: "no"
    # This is a one-shot CLI container. Schedule it with cron, systemd,
    # GitHub Actions, or an external scheduler instead of Compose restart.
    # For one-time run, use: docker compose run --rm horizon
    command: ["--hours", "24"]
