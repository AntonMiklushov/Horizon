<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Horizon{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050506;
      --panel: #0e0e10;
      --panel-raised: #151517;
      --text: #f4f4f5;
      --muted: #a0a0a8;
      --line: #29292e;
      --accent: #35d0ba;
      --accent-strong: #73f0dd;
      --accent-soft: rgba(53, 208, 186, 0.16);
      --warn: #f1b54a;
      --bad: #ff8277;
      --good: #5cdb86;
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, rgba(53, 208, 186, 0.08), transparent 34rem),
        var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
    .nav {
      background: #000;
      color: var(--text);
      padding: 18px 14px;
      border-right: 1px solid var(--line);
    }
    .brand { font-size: 18px; font-weight: 700; margin: 0 0 18px; }
    .nav a {
      color: #d8d8dc;
      display: block;
      padding: 9px 10px;
      border-radius: 8px;
      margin: 3px 0;
    }
    .nav a:hover { background: #17171a; color: var(--accent-strong); text-decoration: none; }
    main { padding: 24px; max-width: 1280px; width: 100%; }
    h1 { font-size: 24px; line-height: 1.2; margin: 0 0 18px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    h3 { font-size: 14px; margin: 18px 0 8px; }
    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .band {
      background: var(--panel);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 16px;
      margin-bottom: 16px;
    }
    .metric { font-size: 24px; font-weight: 700; }
    .muted { color: var(--muted); }
    .ok { color: var(--good); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin: 2px 4px 2px 0;
    }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    input[type="text"], input[type="number"], input[type="url"], textarea, select {
      width: 100%;
      min-height: 38px;
      border: 1px solid #c8d0dc;
      border-color: #37373d;
      border-radius: 8px;
      padding: 8px 10px;
      background: #070708;
      color: var(--text);
      font: inherit;
    }
    input[type="checkbox"] { accent-color: var(--accent); }
    textarea { min-height: 96px; resize: vertical; }
    .row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; align-items: end; }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .checkline { display: flex; align-items: center; gap: 8px; min-height: 38px; font-weight: 500; }
    .checks { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 4px; }
    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #03110f;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .button.secondary, button.secondary {
      background: #050506;
      color: var(--accent);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 8px; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0; }
    .tabbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin: 18px 0 16px;
    }
    .tab-button {
      border: 0;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      min-height: 40px;
      padding: 8px 10px;
    }
    .tab-button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    [data-tab-panel][hidden] { display: none; }
    pre {
      white-space: pre-wrap;
      background: #050506;
      color: #efeff1;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
    }
    .report {
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      max-width: 920px;
    }
    .report h1 { font-size: 28px; }
    .report h2 { font-size: 19px; margin-top: 24px; }
    .report img, .report table { max-width: 100%; }
    .notice { border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; background: #101820; border: 1px solid #24384a; }
    .notice.error { background: #22100f; border-color: #63332f; color: var(--bad); }
    .notice.saved { background: #0d1d13; border-color: #28553a; color: var(--good); }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .nav { position: static; }
      main { padding: 16px; }
      .grid.two, .grid.three { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .row > * { grid-column: span 1 !important; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="shell">
    <nav class="nav">
      <div class="brand">Horizon</div>
      <a href="/">Dashboard</a>
      <a href="/settings/basic">Basic Settings</a>
      <a href="/settings/sources">Sources</a>
    </nav>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
